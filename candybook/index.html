<title>Little Dino Comes Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika&family=Fredoka:wght@500;700&display=swap">
<style>
  /* One picture book lying on a dark wooden table: the page fills the width,
     with the keys underneath like a row of chunky keycaps. */
  :root {
    --table: #2b1c22;
    --table-2: #3b2730;
    --paper: #fffaf0;
    --ink: #46282f;
    --cap: #f6eedd;
    --cap-edge: #c9b79c;
    --glow: #ffd27a;
    --pink: #ffa3c4; --pink-edge: #d4678f;
    --blue: #96d4ff; --blue-edge: #4f9bd2;
    --green: #a4e294; --green-edge: #5ea752;
    --display: "Fredoka", "Baloo 2", system-ui, sans-serif;
    --body: "Andika", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, var(--table-2), var(--table) 70%);
    color: var(--paper);
    font-family: var(--body);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .book {
    position: relative;
    width: min(100%, calc((100vh - 130px) * 16 / 9));
    max-width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 6px 14px 14px 6px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55), 0 2px 0 6px #5a3a44, 0 2px 0 9px #2a181e;
  }
  #page { display: block; width: 100%; height: 100%; border-radius: inherit; outline: none; cursor: pointer; touch-action: manipulation; }
  #page:focus-visible { box-shadow: 0 0 0 4px var(--glow); }
  .keys { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: stretch; max-width: 100%; }
  .keys button {
    font-family: var(--display);
    color: var(--ink);
    border: 0; border-radius: 14px;
    padding: 8px 16px 10px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform 0.08s, box-shadow 0.08s, background-color 0.2s;
  }
  .keys .act { min-width: 168px; background: var(--c); box-shadow: 0 5px 0 var(--edge), 0 8px 14px rgba(0,0,0,0.35); }
  .keys .pink { --c: var(--pink); --edge: var(--pink-edge); }
  .keys .blue { --c: var(--blue); --edge: var(--blue-edge); }
  .keys .green { --c: var(--green); --edge: var(--green-edge); }
  .keys .turn { flex-direction: row; gap: 8px; background: var(--cap); box-shadow: 0 5px 0 var(--cap-edge), 0 8px 14px rgba(0,0,0,0.35); font: 600 17px/1 var(--display); }
  .keys .who { font: 500 12px/1.1 var(--body); opacity: 0.75; letter-spacing: 0.02em; }
  .keys .what { font: 700 19px/1.15 var(--display); }
  .keys .turn .what { font: 600 17px/1 var(--display); }
  .keys .arrow { font-size: 14px; }
  .keys button:active, .keys button.hit { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge, var(--cap-edge)), 0 2px 4px rgba(0,0,0,0.35); }
  .keys button:disabled { opacity: 0.35; cursor: default; transform: none; }
  .keys button:focus-visible, #mute:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
  .keys button.fresh .what { animation: pop 0.35s ease-out; }
  @keyframes pop { from { transform: scale(0.8); opacity: 0.3; } to { transform: scale(1); opacity: 1; } }
  #mute { background: transparent; color: var(--paper); box-shadow: none; border: 2px solid rgba(255,250,240,0.35); padding: 8px 12px; font: 500 14px/1 var(--display); }
  @media (max-width: 600px) {
    .keys { gap: 6px; }
    .keys button { padding: 6px 10px 8px; }
    .keys .act { min-width: 0; flex: 1 1 0; }
    .keys .turn { flex: 0 0 auto; padding: 6px 10px; }
    .keys .who { display: none; }
    .keys .what { font-size: 14px; }
    .keys .turn .what { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .keys button { transition: none; } .keys button.fresh .what { animation: none; } }
</style>
<div class="book"><canvas id="page" tabindex="0" aria-label="Little Dino Comes Home, a picture book. Left and right arrows turn the pages; the pink, blue and green buttons (Space, Enter and Ctrl) make things happen."></canvas></div>
<div class="keys">
  <button type="button" class="turn" data-key="prev" title="Left arrow" aria-keyshortcuts="ArrowLeft"><span class="arrow" aria-hidden="true">◀</span><span class="what">Back</span></button>
  <button type="button" class="act pink" data-key="space" title="Space bar" aria-keyshortcuts="Space"><span class="who">Candy machine</span><span class="what">Candy fountain</span></button>
  <button type="button" class="act blue" data-key="enter" title="Enter key" aria-keyshortcuts="Enter"><span class="who">Robots</span><span class="what">Robot disco</span></button>
  <button type="button" class="act green" data-key="ctrl" title="Ctrl key" aria-keyshortcuts="Control"><span class="who">Little Dino</span><span class="what">Big jump</span></button>
  <button type="button" class="turn" data-key="next" title="Right arrow" aria-keyshortcuts="ArrowRight"><span class="what">Next page</span><span class="arrow" aria-hidden="true">▶</span></button>
  <button type="button" id="mute" aria-pressed="false">Sound on</button>
</div>
<script>
'use strict';
// ---------- storybook drawing kit ----------
// Everything is drawn in a 1280x720 page with flat colours and a soft brown
// ink line, under save/translate/rotate/scale so characters can squash,
// stretch, flip and spin.
const W = 1280, H = 720, TAU = Math.PI * 2;
const INK = '#46282f', WHITE = '#fffcf6';
let ctx = null; // the canvas being drawn on right now

const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = n => Math.floor(Math.random() * n);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const springOut = t => t <= 0 ? 0 : 1 - Math.exp(-6 * t) * Math.cos(14 * t);
const pick = a => a[irnd(a.length)];
const CANDY = ['#ff5c78', '#ffaa3c', '#fade50', '#6ed278', '#5ab4f5', '#b978eb', '#ff8cc8'];

function push(x, y, rot = 0, sx = 1, sy = 1) {
  ctx.save(); ctx.translate(x, y);
  if (rot) ctx.rotate(rot * Math.PI / 180);
  if (sx !== 1 || sy !== 1) ctx.scale(sx, sy);
}
function pop() { ctx.restore(); }

function paint(fill, lw) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke(); }
}
function circ(x, y, r, fill, lw = 3) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); paint(fill, lw); }
function ell(x, y, rx, ry, fill, lw = 3, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.01, Math.abs(rx)), Math.max(0.01, Math.abs(ry)), rot, 0, TAU); paint(fill, lw);
}
function rrect(x, y, w, h, r, fill, lw = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2))); paint(fill, lw);
}
function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
function poly(pts, fill, lw = 3) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); paint(fill, lw);
}
// line: an inked noodle (a stroke with a darker stroke behind it)
function line(x1, y1, x2, y2, w, col, lw = 3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  if (lw) { ctx.lineWidth = w + lw * 2; ctx.strokeStyle = INK; ctx.stroke(); }
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, col, lw = 3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2);
  if (lw) { ctx.lineWidth = w + lw * 2; ctx.strokeStyle = INK; ctx.stroke(); }
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
}
function shine(x, y, r) { ell(x, y, r, r * 0.6, 'rgba(255,255,255,0.75)', 0); }
function starPath(x, y, r, rot, n, inner = 0.5) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i / (n * 2) * TAU, rr = i % 2 ? r * inner : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function star(x, y, r, rot, n, fill, lw = 3) { starPath(x, y, r, rot, n); paint(fill, lw); }
function heart(x, y, s, fill, lw = 3) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 1.1);
  ctx.bezierCurveTo(x - s * 1.6, y - s * 0.1, x - s * 0.9, y - s * 1.3, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.9, y - s * 1.3, x + s * 1.6, y - s * 0.1, x, y + s * 1.1);
  paint(fill, lw);
  shine(x - s * 0.55, y - s * 0.45, s * 0.22);
}
function gear(x, y, r, rot, teeth, fill) {
  ctx.beginPath();
  const st = TAU / teeth;
  for (let i = 0; i < teeth; i++) {
    const a0 = rot + i * st;
    for (const [f, rr] of [[0, r], [0.15, r * 1.22], [0.45, r * 1.22], [0.6, r]])
      ctx.lineTo(x + Math.cos(a0 + f * st) * rr, y + Math.sin(a0 + f * st) * rr);
  }
  ctx.closePath(); paint(fill, 3);
  circ(x, y, r * 0.55, shade(fill, -0.15), 0);
  circ(x, y, r * 0.18, shade(fill, 0.35));
}
// shade lightens (k>0) or darkens (k<0) a #rrggbb colour
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = k > 0 ? 255 : 0, a = Math.abs(k);
  r = Math.round(r + (t - r) * a); g = Math.round(g + (t - g) * a); b = Math.round(b + (t - b) * a);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function alpha(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${clamp(a, 0, 1)})`;
}
function grad(x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  return g;
}
function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, alpha(col, a)); g.addColorStop(1, alpha(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
// word: a bouncy onomatopoeia in the display face with a fat ink outline
function word(text, x, y, size, rot, fill) {
  if (size < 2) return;
  push(x, y, rot);
  ctx.font = `700 ${size}px Fredoka, "Baloo 2", system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.2; ctx.strokeStyle = INK; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(text, 0, 0);
  pop();
}
function cloud(x, y, s, col = WHITE, a = 1) {
  ctx.globalAlpha = a;
  const bumps = [[-26, 6, 18], [0, 0, 24], [26, 6, 18], [12, 12, 16], [-12, 12, 16]];
  ctx.beginPath();
  for (const [bx, by, r] of bumps) { ctx.moveTo(x + (bx + r) * s, y + by * s); ctx.arc(x + bx * s, y + by * s, r * s, 0, TAU); }
  ctx.lineWidth = 6 * s; ctx.strokeStyle = 'rgba(70,40,47,0.25)'; ctx.stroke();
  ctx.fillStyle = col; ctx.fill();
  ctx.globalAlpha = 1;
}

// drawCandy: a wrapped sweet, a lollipop, a gumball or a star
function drawCandy(x, y, rot, s, col, kind) {
  push(x, y, rot * 57.3);
  const light = shade(col, 0.4);
  switch (kind) {
    case 0:
      poly([-s * 0.7, 0, -s * 1.4, -s * 0.6, -s * 1.4, s * 0.6], light, 2.5);
      poly([s * 0.7, 0, s * 1.4, -s * 0.6, s * 1.4, s * 0.6], light, 2.5);
      ell(0, 0, s * 0.85, s * 0.62, col, 2.5);
      line(-s * 0.3, -s * 0.45, s * 0.1, s * 0.45, s * 0.18, light, 0);
      shine(-s * 0.35, -s * 0.25, s * 0.22);
      break;
    case 1:
      line(0, s * 0.6, 0, s * 1.8, s * 0.22, WHITE, 2.5);
      circ(0, 0, s * 0.8, col, 2.5);
      ctx.beginPath();
      for (let a = 0; a < 9; a += 0.3) ctx.lineTo(Math.cos(a) * a * s * 0.08, Math.sin(a) * a * s * 0.08);
      ctx.lineWidth = s * 0.16; ctx.strokeStyle = light; ctx.stroke();
      shine(-s * 0.3, -s * 0.35, s * 0.2);
      break;
    case 2:
      circ(0, 0, s * 0.72, col, 2.5);
      shine(-s * 0.25, -s * 0.3, s * 0.24);
      break;
    default:
      star(0, 0, s * 0.95, -Math.PI / 2, 5, col, 2.5);
      shine(-s * 0.2, -s * 0.25, s * 0.2);
  }
  pop();
}

// wrapText splits a story line into lines no wider than maxW
function wrapText(text, maxW) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
// ---------- the little things that fly about ----------
// Each page is a Stage with its own candies, confetti, steam, sparkles,
// hearts, notes, bubbles, crumbs, dust and words (BOING! RAWR! YUM!).
class Stage {
  constructor() {
    this.t = 0; this.bits = []; this.words = []; this.shake = 0;
    this.floor = 690;          // where flying candies come to rest
    this.catcher = null;       // (bit) => true if something caught it (the belt)
    this.next = [0, 0, 0];     // which trick each key does next
  }
  add(b) {
    if (this.bits.length > 700) return b;
    b.max = b.life; b.layer = b.layer ?? 1; b.rot = b.rot ?? 0; b.vr = b.vr ?? 0;
    b.vx = b.vx ?? 0; b.vy = b.vy ?? 0; b.g = b.g ?? 0;
    this.bits.push(b); return b;
  }
  candy(x, y, vx, vy, o = {}) {
    return this.add(Object.assign({ kind: 'candy', x, y, vx, vy, vr: rnd(-8, 8), size: rnd(13, 18), col: pick(CANDY),
      candy: irnd(4), life: 9, g: 900, layer: 1 }, o));
  }
  confetti(x, y, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), s = rnd(0.3, 1) * speed;
      this.add({ kind: 'confetti', layer: 2, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.3,
        rot: rnd(0, 6), vr: rnd(-12, 12), size: rnd(6, 11), col: pick(CANDY), life: rnd(1.6, 2.6), g: 380 });
    }
  }
  sparkles(x, y, n, r, col) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), d = r * Math.random();
      this.add({ kind: 'sparkle', layer: 2, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 - 30,
        rot: rnd(0, 3), vr: rnd(-3, 3), size: rnd(7, 13), col: col || shade(pick(CANDY), 0.5), life: rnd(0.5, 0.9) });
    }
  }
  hearts(x, y, n) {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'heart', layer: 2, x: x + rnd(-20, 20), y, vx: rnd(-25, 25), vy: rnd(-110, -70), rot: rnd(0, 6),
        size: rnd(8, 12), col: '#ff6082', life: rnd(1.2, 1.7) });
  }
  notes(x, y, n) {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'note', layer: 2, x: x + rnd(-30, 30), y, vx: rnd(-30, 30), vy: rnd(-100, -70), rot: rnd(0, 6),
        size: 8, col: pick(CANDY), life: 1.6 });
  }
  puff(x, y, size, col, layer = 0, o = {}) {
    return this.add(Object.assign({ kind: 'puff', layer, x, y, vx: rnd(-12, 12), vy: rnd(-60, -35), size, col, life: rnd(1.6, 2.4) }, o));
  }
  dust(x, y, n) {
    for (let i = 0; i < n; i++) {
      const s = i % 2 ? 1 : -1;
      this.add({ kind: 'dust', layer: 2, x: x + s * rnd(0, 30), y, vx: s * rnd(60, 160), vy: rnd(-40, -10), size: rnd(10, 18),
        col: '#ecd6be', life: rnd(0.5, 0.8) });
    }
  }
  crumbs(x, y, col, n) {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'crumb', layer: 2, x, y, vx: rnd(-90, 90), vy: rnd(-160, -40), size: rnd(2.5, 4.5), col, life: rnd(0.5, 0.9), g: 700 });
  }
  bubbles(x, y, n) {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'bubble', layer: 2, x: x + rnd(-10, 10), y, vx: rnd(-50, 50), vy: rnd(-120, -60), rot: rnd(0, 6),
        size: rnd(8, 16), col: CANDY[i % CANDY.length], life: rnd(1.4, 2.2) });
  }
  zzz(x, y) {
    this.add({ kind: 'z', layer: 2, x, y, vx: 20, vy: -30, rot: 0, size: rnd(22, 30), col: '#a8c8ff', life: 2.6 });
  }
  leaf(x, y) {
    this.add({ kind: 'leaf', layer: 2, x, y, vx: rnd(10, 60), vy: rnd(20, 50), rot: rnd(0, 6), vr: rnd(-3, 3), size: rnd(7, 11),
      col: pick(['#f08c3c', '#e65a3c', '#f5c446', '#c8783c']), life: rnd(5, 8), ph: rnd(0, 6) });
  }
  drops(x, y, n, speed = 260, col = '#bfe6ff') {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'drop', layer: 2, x, y, vx: rnd(-1, 1) * speed * 0.6, vy: -rnd(0.4, 1) * speed, size: rnd(3, 6), col, life: rnd(0.6, 1), g: 800 });
  }
  say(text, x, y, size, col) { this.words.push({ text, x, y, size, col, life: 1.6, max: 1.6, rot: rnd(-10, 10) }); }

  update(dt) {
    this.t += dt;
    this.shake = Math.max(0, this.shake - dt * 2.5);
    const live = [];
    for (const b of this.bits) {
      b.life -= dt;
      if (b.life <= 0) { if (b.kind === 'bubble') { this.sparkles(b.x, b.y, 3, b.size); sfx('pop', 0.15, 1.6); } continue; }
      b.vy += b.g * dt;
      switch (b.kind) {
        case 'confetti': b.vx *= 1 - 2 * dt; b.vy = Math.min(b.vy, 120); b.x += Math.sin(b.life * 7 + b.rot) * 40 * dt; break;
        case 'puff': b.size += 22 * dt; b.vx *= 1 - dt; break;
        case 'heart': case 'note': case 'z': b.x += Math.sin(b.life * 5 + b.rot) * 30 * dt; break;
        case 'bubble': b.x += Math.sin(b.life * 3 + b.rot) * 40 * dt; b.vy *= 1 - 0.5 * dt; break;
        case 'dust': b.vx *= 1 - 5 * dt; b.size += 25 * dt; break;
        case 'leaf': b.vx += Math.sin(b.life * 2 + b.ph) * 50 * dt; b.vy = Math.min(b.vy + 20 * dt, 45); if (b.y > this.floor - 6) { b.y = this.floor - 6; b.vx = 0; b.vy = 0; b.vr = 0; } break;
      }
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      if (b.kind === 'candy') this.candyPhysics(b);
      if (b.life > 0) live.push(b);
    }
    this.bits = live;
    this.words = this.words.filter(w => (w.life -= dt) > 0);
  }
  candyPhysics(b) {
    if (b.resting) { b.vx = b.vy = b.vr = 0; return; }
    if (b.vy > 0 && this.catcher && this.catcher(b)) { b.life = 0; return; }
    const floor = this.floor - b.size * 0.4;
    if (b.y > floor && b.vy > 0) {
      b.y = floor;
      if (b.vy > 140) { b.vy *= -0.42; b.vx *= 0.7; b.vr *= 0.6; if (b.size > 12) sfx('tick', 0.12, rnd(0.8, 1.4)); }
      else b.resting = true;
    }
    if (b.x < 20 || b.x > W - 20) { b.vx = -b.vx * 0.6; b.x = clamp(b.x, 20, W - 20); }
  }
  draw(layer) {
    for (const b of this.bits) {
      if (b.layer !== layer) continue;
      const a = clamp(b.life / 0.5, 0, 1);
      ctx.globalAlpha = a;
      switch (b.kind) {
        case 'candy': drawCandy(b.x, b.y, b.rot, b.size, b.col, b.candy); break;
        case 'confetti':
          push(b.x, b.y, b.rot * 57, Math.cos(b.life * 9), 1);

        case 'puff': {

        case 'note':
          push(b.x, b.y, Math.sin(b.life * 6) * 15);
          line(b.size * 0.8, 0, b.size * 0.8, -b.size * 3, 3, b.col, 2);

        case 'leaf':

// ---------- sound: everything is synthesised, nothing is loaded ----------
const AU = { ctx: null, muted: false };

function audioStart() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const C = AU.ctx = new AC();
  const comp = C.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.2;
  comp.connect(C.destination);
  AU.master = C.createGain(); AU.master.gain.value = AU.muted ? 0 : 0.9; AU.master.connect(comp);
  // a small warm room for the music and the noises
  AU.verb = C.createConvolver();
  const len = Math.floor(C.sampleRate * 2.4), imp = C.createBuffer(2, len, C.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = imp.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
  }
  AU.verb.buffer = imp;
  const vg = C.createGain(); vg.gain.value = 0.32; AU.verb.connect(vg); vg.connect(AU.master);
  AU.music = C.createGain(); AU.music.gain.value = 0.55; AU.music.connect(AU.master); AU.music.connect(AU.verb);
  AU.amb = C.createGain(); AU.amb.gain.value = 0.7; AU.amb.connect(AU.master);
  AU.fx = C.createGain(); AU.fx.gain.value = 0.85; AU.fx.connect(AU.master);
  const fs = C.createGain(); fs.gain.value = 0.25; AU.fx.connect(fs); fs.connect(AU.verb);
  const nb = C.createBuffer(1, C.sampleRate * 2, C.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  AU.noise = nb;
  Music.start();
  Amb.set(Amb.want);
}
function setMuted(m) {
  AU.muted = m;
  if (AU.ctx) AU.master.gain.setTargetAtTime(m ? 0 : 0.9, AU.ctx.currentTime, 0.1);

// osc plays one enveloped oscillator note into dest.
function osc(type, f0, t, dur, vol, dest, o = {}) {
  const C = AU.ctx, n = C.createOscillator(), g = C.createGain();
  n.type = type; n.frequency.setValueAtTime(f0, t);
  if (o.f1) n.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + (o.sweep ?? dur));
  if (o.path) for (const [ft, fv] of o.path) n.frequency.linearRampToValueAtTime(fv, t + ft);
  if (o.vib) {
    const l = C.createOscillator(), lg = C.createGain();
    l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(n.frequency);
    l.start(t); l.stop(t + dur + 0.2);
  }
  if (o.fm) { // a simple FM modulator for bells and electric piano
    const m = C.createOscillator(), mg = C.createGain();
    m.frequency.value = f0 * o.fm[0]; mg.gain.setValueAtTime(f0 * o.fm[1], t);
    mg.gain.setTargetAtTime(0, t, o.fm[2]); m.connect(mg); mg.connect(n.frequency);
    m.start(t); m.stop(t + dur + 0.2);
  }
  const a = o.a ?? 0.005, hold = o.hold ?? 0;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  if (hold) g.gain.setValueAtTime(vol, t + a + hold);
  g.gain.setTargetAtTime(0.0001, t + a + hold, o.d ?? dur / 4);
  let out = g;
  if (o.lp) { const f = C.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q ?? 0.7; g.connect(f); out = f; }
  if (o.bp) { const f = C.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.q ?? 2; g.connect(f); out = f; }
  if (o.pan !== undefined && C.createStereoPanner) {
    const p = C.createStereoPanner(); p.pan.setValueAtTime(o.pan, t);
    if (o.pan1 !== undefined) p.pan.linearRampToValueAtTime(o.pan1, t + dur);
    out.connect(p); out = p;
  }
  n.connect(g); out.connect(dest);
  n.start(t); n.stop(t + dur + 0.1);
  return n;
}
// noise plays a burst of filtered noise.
function noise(t, dur, vol, dest, o = {}) {
  const C = AU.ctx, s = C.createBufferSource(), f = C.createBiquadFilter(), g = C.createGain();
  s.buffer = AU.noise; s.loop = true;
  f.type = o.type ?? 'bandpass'; f.frequency.setValueAtTime(o.f0 ?? 1000, t); f.Q.value = o.q ?? 1;
  if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
  const a = o.a ?? 0.005;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a);
  if (o.hold) g.gain.setValueAtTime(vol, t + a + o.hold);
  g.gain.setTargetAtTime(0.0001, t + a + (o.hold ?? 0), o.d ?? dur / 4);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.1);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// ---- instruments (used by the music and by some noises) ----
const INST = {
  box(f, t, dur, v, out) { // music box
    [[1, 1, 1.4], [2, 0.32, 0.6], [3, 0.1, 0.3], [4.2, 0.07, 0.2]].forEach(([k, a, d]) => osc('sine', f * k, t, d * 2, v * a * 0.22, out, { d: d / 2.5 }));
  },
  bell(f, t, dur, v, out) { osc('sine', f, t, 1.6, v * 0.2, out, { fm: [3.5, 2.2, 0.25], d: 0.5 }); },
  marimba(f, t, dur, v, out) {
    osc('sine', f, t, 0.6, v * 0.32, out, { d: 0.14 });
    osc('sine', f * 4, t, 0.1, v * 0.06, out, { d: 0.02 });
  },
  epiano(f, t, dur, v, out) {
    osc('sine', f, t, dur + 1.2, v * 0.2, out, { fm: [1, 1.4, 0.35], d: 0.7 });
    osc('sine', f * 2, t, 0.6, v * 0.03, out, { d: 0.2 });
  },
  flute(f, t, dur, v, out) {
    osc('sine', f, t, dur + 0.3, v * 0.16, out, { a: 0.09, hold: dur * 0.75, d: 0.12, vib: [5, f * 0.006] });
    osc('triangle', f * 2, t, dur + 0.3, v * 0.025, out, { a: 0.1, hold: dur * 0.7, d: 0.1 });
    noise(t, 0.12, v * 0.02, out, { f0: f * 2, q: 3, d: 0.05 });
  },
  pluck(f, t, dur, v, out) { osc('triangle', f, t, 0.5, v * 0.09, out, { d: 0.12, lp: 2600 }); },
  harp(f, t, dur, v, out) { osc('triangle', f, t, 1.6, v * 0.08, out, { d: 0.45, lp: 3000 }); },
  pad(f, t, dur, v, out) {
    for (const det of [-7, 7]) osc('sawtooth', f * Math.pow(2, det / 1200), t, dur + 1.4, v * 0.03, out, { a: 0.9, hold: Math.max(0, dur - 0.9), d: 0.6, lp: 750 });
  },
  bass(f, t, dur, v, out) { osc('sine', f, t, dur + 0.4, v * 0.26, out, { a: 0.01, d: dur * 0.35 }); },
  pizz(f, t, dur, v, out) { osc('triangle', f, t, 0.4, v * 0.22, out, { d: 0.09, lp: 900 }); },
  wood(f, t, dur, v, out) { osc('sine', 950, t, 0.05, v * 0.05, out, { d: 0.015 }); },
};

// ---- the theme: "Coming Home", a lullaby in 3/4 ----

const Music = {
  want: 'cover', arr: ARRANGE.cover, step: 0, nextT: 0, timer: null, events: null,
  start() {
    // melody notes indexed by their starting eighth
    this.events = {};
    let b = 0;
    for (const [m, d] of THEME.melody) { this.events[b * 2] = [m, d]; b += d; }

    this.timer = setInterval(() => this.tick(), 40);
  },
  set(name) { this.want = name; },
  tick() {
    const C = AU.ctx;
    while (this.nextT < C.currentTime + 0.25) {
      const i = this.step % 96; // 16 bars of 3 beats, in eighths
      if (i % 6 === 0) this.arr = ARRANGE[this.want] || ARRANGE.cover; // change instruments on the bar
      const a = this.arr, beat = 60 / a.bpm, t = this.nextT, v = a.soft ?? 1;
      const bar = Math.floor(i / 6), ch = CHORD[THEME.chords[bar]], out = AU.music;
      if (i % 6 === 0) {
        if (a.pad) for (const m of ch) INST.pad(mtof(m + 12), t, beat * 3, a.pad * v, out);
        if (a.bass) INST[a.bass](mtof(ch[0] - (ch[0] > 47 ? 12 : 0)), t, beat * 2, v, out);

      if (a.bass === 'pizz' && i % 6 === 2) INST.pizz(mtof(ch[2] - 12), t, beat, v * 0.7, out);
      if (a.bass === 'pizz' && i % 6 === 4) INST.pizz(mtof(ch[1] - 12), t, beat, v * 0.7, out);
      if (a.arp) INST[a.arp](mtof(ch[[0, 1, 2, 1, 2, 1][i % 6]] + 24), t, beat / 2, v * (i % 2 ? 0.6 : 0.9), out);
      if (a.perc && i % 2 === 0) INST.wood(0, t, 0, v * (i % 6 === 0 ? 1.4 : 0.8), out);
      const e = this.events[i];
      if (e) INST[a.lead](mtof(e[0] + a.oct), t, e[1] * beat, v, out);
      this.nextT += beat / 2;
      this.step++;

const Amb = {
  want: 'cover', beds: [], clock: 0, timers: {},

    const C = AU.ctx, now = C.currentTime;
    for (const b of this.beds) { b.g.gain.setTargetAtTime(0, now, 0.4); b.nodes.forEach(n => n.stop(now + 2)); }

      const s = C.createBufferSource(), fl = C.createBiquadFilter(), g = C.createGain(), nodes = [s];

// The bottom-right corner of the lifting page is pulled across to the left.
// The fold is the line halfway between where the corner was and where it is;
// beyond the fold we see the back of the page, reflected across that line.
function drawTurn(main, A, B, e) {

  if (e >= 0.998) { g.drawImage(B, 0, 0, W, H); return; }

// ---------- start-up, the frame loop and the keys ----------
(function () {

    offA.width = offB.width = canvas.width; offA.height = offB.height = canvas.height;
    scale = canvas.width / W;
  }
  window.addEventListener('resize', resize);
  resize();

  Book.init();
  for (const p of Book.pages) if (reduce) p.reduce = true;
