<meta charset="utf-8">
<title>Mama Comes Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika&family=Fredoka:wght@500;700&display=swap">
<style>
  /* One picture book lying on a dark wooden table: the page fills the width,
     with the keys underneath like a row of chunky keycaps. */
  :root {
    --table: #2b1c22;
    --table-2: #3b2730;
    --paper: #fffaf0;
    --ink: #46282f;
    --cap: #f6eedd;
    --cap-edge: #c9b79c;
    --glow: #ffd27a;
    --pink: #ffa3c4; --pink-edge: #d4678f;
    --blue: #96d4ff; --blue-edge: #4f9bd2;
    --green: #a4e294; --green-edge: #5ea752;
    --display: "Fredoka", "Baloo 2", system-ui, sans-serif;
    --body: "Andika", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, var(--table-2), var(--table) 70%);
    color: var(--paper);
    font-family: var(--body);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .book {
    position: relative;
    width: min(100%, calc((100vh - 140px) * 16 / 9));
    max-width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 6px 14px 14px 6px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55), 0 2px 0 6px #5a3a44, 0 2px 0 9px #2a181e;
  }
  #page { display: block; width: 100%; height: 100%; border-radius: inherit; outline: none; cursor: pointer; touch-action: manipulation; }
  #page:focus-visible { box-shadow: 0 0 0 4px var(--glow); }
  .keys { display: flex; align-items: center; justify-content: center; gap: 28px; max-width: 100%; }
  .acts { display: flex; gap: 22px; }
  .keys button { border: 0; cursor: pointer; display: grid; place-items: center; padding: 0; transition: transform 0.08s, box-shadow 0.08s; }
  .keys .act { width: 104px; height: 78px; border-radius: 22px; background: var(--c); box-shadow: 0 6px 0 var(--edge), 0 10px 16px rgba(0,0,0,0.35); }
  .keys .act svg { width: 58px; height: 58px; }
  .keys .pink { --c: var(--pink); --edge: var(--pink-edge); }
  .keys .blue { --c: var(--blue); --edge: var(--blue-edge); }
  .keys .green { --c: var(--green); --edge: var(--green-edge); }
  .keys .turn { width: 64px; height: 64px; border-radius: 50%; background: var(--cap); color: var(--ink); box-shadow: 0 5px 0 var(--cap-edge), 0 8px 14px rgba(0,0,0,0.35); }
  .keys .turn svg { width: 30px; height: 30px; }
  .keys button:active, .keys button.hit { transform: translateY(5px); box-shadow: 0 1px 0 var(--edge, var(--cap-edge)), 0 2px 4px rgba(0,0,0,0.35); }
  .keys button:disabled { opacity: 0.3; cursor: default; transform: none; }
  .keys button:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
  #mute { width: 46px; height: 46px; border-radius: 50%; background: transparent; color: var(--paper); border: 2px solid rgba(255,250,240,0.35); box-shadow: none; margin-left: -6px; }
  #mute svg { width: 24px; height: 24px; }
  #mute .cross { display: none; }
  #mute[aria-pressed="true"] .cross { display: inline; }
  #mute[aria-pressed="true"] .waves { display: none; }
  @media (max-width: 640px) {
    .keys { gap: 12px; }
    .acts { gap: 10px; }
    .keys .act { width: 68px; height: 56px; border-radius: 16px; }
    .keys .act svg { width: 40px; height: 40px; }
    .keys .turn { width: 46px; height: 46px; }
    .keys .turn svg { width: 22px; height: 22px; }
    #mute { width: 36px; height: 36px; }
  }
  @media (prefers-reduced-motion: reduce) { .keys button { transition: none; } }
</style>

        <circle cx="51" cy="33" r="1.8" fill="#46282f"/><circle cx="22" cy="40" r="4" fill="#ff8296" opacity="0.5"/>
      </svg>

  </div>
  <button type="button" class="turn" data-key="next" title="Next page (Right arrow)" aria-label="Next page" aria-keyshortcuts="ArrowRight">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 10 L34 24 L18 38" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  </button>
</div>

'use strict';
// ---------- storybook drawing kit ----------
// Everything is drawn in a 1280x720 page with flat colours and a soft brown
// ink line, under save/translate/rotate/scale so characters can squash,
// stretch, flip and spin.
const W = 1280, H = 720, TAU = Math.PI * 2;
const INK = '#46282f', WHITE = '#fffcf6';
let ctx = null; // the canvas being drawn on right now

const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = n => Math.floor(Math.random() * n);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const springOut = t => t <= 0 ? 0 : 1 - Math.exp(-6 * t) * Math.cos(14 * t);
const pick = a => a[irnd(a.length)];
const CANDY = ['#ff5c78', '#ffaa3c', '#fade50', '#6ed278', '#5ab4f5', '#b978eb', '#ff8cc8'];

function push(x, y, rot = 0, sx = 1, sy = 1) {
  ctx.save(); ctx.translate(x, y);
  if (rot) ctx.rotate(rot * Math.PI / 180);
  if (sx !== 1 || sy !== 1) ctx.scale(sx, sy);
}
function pop() { ctx.restore(); }

function paint(fill, lw) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke(); }
}
function circ(x, y, r, fill, lw = 3) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); paint(fill, lw); }
function ell(x, y, rx, ry, fill, lw = 3, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.01, Math.abs(rx)), Math.max(0.01, Math.abs(ry)), rot, 0, TAU); paint(fill, lw);
}
function rrect(x, y, w, h, r, fill, lw = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2))); paint(fill, lw);
}
function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
function poly(pts, fill, lw = 3) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); paint(fill, lw);
}
// line: an inked noodle (a stroke with a darker stroke behind it)
function line(x1, y1, x2, y2, w, col, lw = 3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  if (lw) { ctx.lineWidth = w + lw * 2; ctx.strokeStyle = INK; ctx.stroke(); }
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, col, lw = 3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2);
  if (lw) { ctx.lineWidth = w + lw * 2; ctx.strokeStyle = INK; ctx.stroke(); }
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
}
function shine(x, y, r) { ell(x, y, r, r * 0.6, 'rgba(255,255,255,0.75)', 0); }
function starPath(x, y, r, rot, n, inner = 0.5) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i / (n * 2) * TAU, rr = i % 2 ? r * inner : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function star(x, y, r, rot, n, fill, lw = 3) { starPath(x, y, r, rot, n); paint(fill, lw); }
function heart(x, y, s, fill, lw = 3) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 1.1);
  ctx.bezierCurveTo(x - s * 1.6, y - s * 0.1, x - s * 0.9, y - s * 1.3, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.9, y - s * 1.3, x + s * 1.6, y - s * 0.1, x, y + s * 1.1);
  paint(fill, lw);
  shine(x - s * 0.55, y - s * 0.45, s * 0.22);
}
function gear(x, y, r, rot, teeth, fill) {
  ctx.beginPath();
  const st = TAU / teeth;
  for (let i = 0; i < teeth; i++) {
    const a0 = rot + i * st;
    for (const [f, rr] of [[0, r], [0.15, r * 1.22], [0.45, r * 1.22], [0.6, r]])
      ctx.lineTo(x + Math.cos(a0 + f * st) * rr, y + Math.sin(a0 + f * st) * rr);
  }
  ctx.closePath(); paint(fill, 3);
  circ(x, y, r * 0.55, shade(fill, -0.15), 0);
  circ(x, y, r * 0.18, shade(fill, 0.35));
}
// shade lightens (k>0) or darkens (k<0) a #rrggbb colour
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = k > 0 ? 255 : 0, a = Math.abs(k);
  r = Math.round(r + (t - r) * a); g = Math.round(g + (t - g) * a); b = Math.round(b + (t - b) * a);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function alpha(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${clamp(a, 0, 1)})`;
}
function grad(x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  return g;
}
function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, alpha(col, a)); g.addColorStop(1, alpha(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
// word: a bouncy onomatopoeia in the display face with a fat ink outline
function word(text, x, y, size, rot, fill) {
  if (size < 2) return;
  push(x, y, rot);
  ctx.font = `700 ${size}px Fredoka, "Baloo 2", system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.2; ctx.strokeStyle = INK; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(text, 0, 0);
  pop();
}
function cloud(x, y, s, col = WHITE, a = 1) {
  ctx.globalAlpha = a;
  const bumps = [[-26, 6, 18], [0, 0, 24], [26, 6, 18], [12, 12, 16], [-12, 12, 16]];
  ctx.beginPath();
  for (const [bx, by, r] of bumps) { ctx.moveTo(x + (bx + r) * s, y + by * s); ctx.arc(x + bx * s, y + by * s, r * s, 0, TAU); }
  ctx.lineWidth = 6 * s; ctx.strokeStyle = 'rgba(70,40,47,0.25)'; ctx.stroke();
  ctx.fillStyle = col; ctx.fill();
  ctx.globalAlpha = 1;
}

// drawCandy: a wrapped sweet, a lollipop, a gumball or a star
function drawCandy(x, y, rot, s, col, kind) {
  push(x, y, rot * 57.3);
  const light = shade(col, 0.4);
  switch (kind) {
    case 0:
      poly([-s * 0.7, 0, -s * 1.4, -s * 0.6, -s * 1.4, s * 0.6], light, 2.5);
      poly([s * 0.7, 0, s * 1.4, -s * 0.6, s * 1.4, s * 0.6], light, 2.5);
      ell(0, 0, s * 0.85, s * 0.62, col, 2.5);
      line(-s * 0.3, -s * 0.45, s * 0.1, s * 0.45, s * 0.18, light, 0);
      shine(-s * 0.35, -s * 0.25, s * 0.22);
      break;
    case 1:
      line(0, s * 0.6, 0, s * 1.8, s * 0.22, WHITE, 2.5);
      circ(0, 0, s * 0.8, col, 2.5);
      ctx.beginPath();
      for (let a = 0; a < 9; a += 0.3) ctx.lineTo(Math.cos(a) * a * s * 0.08, Math.sin(a) * a * s * 0.08);
      ctx.lineWidth = s * 0.16; ctx.strokeStyle = light; ctx.stroke();
      shine(-s * 0.3, -s * 0.35, s * 0.2);
      break;
    case 2:
      circ(0, 0, s * 0.72, col, 2.5);
      shine(-s * 0.25, -s * 0.3, s * 0.24);
      break;
    default:
      star(0, 0, s * 0.95, -Math.PI / 2, 5, col, 2.5);
      shine(-s * 0.2, -s * 0.25, s * 0.2);
  }
  pop();
}

// wrapText splits a story line into lines no wider than maxW
function wrapText(text, maxW) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Each page is a Stage with its own candies, confetti, steam, sparkles,
// hearts, notes, bubbles, crumbs, dust and words (BOING! RAWR! YUM!).
class Stage {
  constructor() {
    this.t = 0; this.bits = []; this.words = []; this.shake = 0;
    this.floor = 690;          // where flying candies come to rest
    this.catcher = null;       // (bit) => true if something caught it (the belt)
    this.next = [0, 0, 0];     // which trick each key does next
  }
  add(b) {
    if (this.bits.length > 700) return b;
    b.max = b.life; b.layer = b.layer ?? 1; b.rot = b.rot ?? 0; b.vr = b.vr ?? 0;
    b.vx = b.vx ?? 0; b.vy = b.vy ?? 0; b.g = b.g ?? 0;
    this.bits.push(b); return b;
  }
  candy(x, y, vx, vy, o = {}) {
    return this.add(Object.assign({ kind: 'candy', x, y, vx, vy, vr: rnd(-8, 8), size: rnd(13, 18), col: pick(CANDY),
      candy: irnd(4), life: 9, g: 900, layer: 1 }, o));
  }
  confetti(x, y, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), s = rnd(0.3, 1) * speed;
      this.add({ kind: 'confetti', layer: 2, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.3,
        rot: rnd(0, 6), vr: rnd(-12, 12), size: rnd(6, 11), col: pick(CANDY), life: rnd(1.6, 2.6), g: 380 });
    }
  }
  sparkles(x, y, n, r, col) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), d = r * Math.random();
      this.add({ kind: 'sparkle', layer: 2, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 - 30,
        rot: rnd(0, 3), vr: rnd(-3, 3), size: rnd(7, 13), col: col || shade(pick(CANDY), 0.5), life: rnd(0.5, 0.9) });
    }
  }
  hearts(x, y, n) {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'heart', layer: 2, x: x + rnd(-20, 20), y, vx: rnd(-25, 25), vy: rnd(-110, -70), rot: rnd(0, 6),
        size: rnd(8, 12), col: '#ff6082', life: rnd(1.2, 1.7) });
  }
  notes(x, y, n) {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'note', layer: 2, x: x + rnd(-30, 30), y, vx: rnd(-30, 30), vy: rnd(-100, -70), rot: rnd(0, 6),
        size: 8, col: pick(CANDY), life: 1.6 });
  }
  puff(x, y, size, col, layer = 0, o = {}) {
    return this.add(Object.assign({ kind: 'puff', layer, x, y, vx: rnd(-12, 12), vy: rnd(-60, -35), size, col, life: rnd(1.6, 2.4) }, o));
  }
  dust(x, y, n) {
    for (let i = 0; i < n; i++) {
      const s = i % 2 ? 1 : -1;
      this.add({ kind: 'dust', layer: 2, x: x + s * rnd(0, 30), y, vx: s * rnd(60, 160), vy: rnd(-40, -10), size: rnd(10, 18),
        col: '#ecd6be', life: rnd(0.5, 0.8) });
    }
  }
  crumbs(x, y, col, n) {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'crumb', layer: 2, x, y, vx: rnd(-90, 90), vy: rnd(-160, -40), size: rnd(2.5, 4.5), col, life: rnd(0.5, 0.9), g: 700 });
  }
  bubbles(x, y, n) {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'bubble', layer: 2, x: x + rnd(-10, 10), y, vx: rnd(-50, 50), vy: rnd(-120, -60), rot: rnd(0, 6),
        size: rnd(8, 16), col: CANDY[i % CANDY.length], life: rnd(1.4, 2.2) });
  }
  zzz(x, y) {
    this.add({ kind: 'z', layer: 2, x, y, vx: 20, vy: -30, rot: 0, size: rnd(22, 30), col: '#a8c8ff', life: 2.6 });
  }
  leaf(x, y) {
    this.add({ kind: 'leaf', layer: 2, x, y, vx: rnd(10, 60), vy: rnd(20, 50), rot: rnd(0, 6), vr: rnd(-3, 3), size: rnd(7, 11),
      col: pick(['#f08c3c', '#e65a3c', '#f5c446', '#c8783c']), life: rnd(5, 8), ph: rnd(0, 6) });
  }
  drops(x, y, n, speed = 260, col = '#bfe6ff') {
    for (let i = 0; i < n; i++)
      this.add({ kind: 'drop', layer: 2, x, y, vx: rnd(-1, 1) * speed * 0.6, vy: -rnd(0.4, 1) * speed, size: rnd(3, 6), col, life: rnd(0.6, 1), g: 800 });
  }
  trail(x, y) { this.add({ kind: 'trail', layer: 0, x, y, vx: 0, vy: 0, size: rnd(5, 8), col: '#ff4646', life: 0.5 }); }
  say(text, x, y, size, col) { this.words.push({ text, x, y, size, col, life: 1.6, max: 1.6, rot: rnd(-10, 10) }); }

  update(dt) {
    this.t += dt;
    this.shake = Math.max(0, this.shake - dt * 2.5);
    const live = [];
    for (const b of this.bits) {
      b.life -= dt;
      if (b.life <= 0) { if (b.kind === 'bubble') { this.sparkles(b.x, b.y, 3, b.size); sfx('pop', 0.15, 1.6); } continue; }
      b.vy += b.g * dt;
      switch (b.kind) {
        case 'confetti': b.vx *= 1 - 2 * dt; b.vy = Math.min(b.vy, 120); b.x += Math.sin(b.life * 7 + b.rot) * 40 * dt; break;
        case 'puff': b.size += 22 * dt; b.vx *= 1 - dt; break;
        case 'heart': case 'note': case 'z': b.x += Math.sin(b.life * 5 + b.rot) * 30 * dt; break;
        case 'bubble': b.x += Math.sin(b.life * 3 + b.rot) * 40 * dt; b.vy *= 1 - 0.5 * dt; break;
        case 'dust': b.vx *= 1 - 5 * dt; b.size += 25 * dt; break;
        case 'leaf': b.vx += Math.sin(b.life * 2 + b.ph) * 50 * dt; b.vy = Math.min(b.vy + 20 * dt, 45); if (b.y > this.floor - 6) { b.y = this.floor - 6; b.vx = 0; b.vy = 0; b.vr = 0; } break;
      }
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      if (b.kind === 'candy') this.candyPhysics(b);
      if (b.life > 0) live.push(b);
    }
    this.bits = live;
    this.words = this.words.filter(w => (w.life -= dt) > 0);
  }
  candyPhysics(b) {
    if (b.resting) { b.vx = b.vy = b.vr = 0; return; }
    if (b.vy > 0 && this.catcher && this.catcher(b)) { b.life = 0; return; }
    const floor = this.floor - b.size * 0.4;
    if (b.y > floor && b.vy > 0) {
      b.y = floor;
      if (b.vy > 140) { b.vy *= -0.42; b.vx *= 0.7; b.vr *= 0.6; if (b.size > 12) sfx('tick', 0.12, rnd(0.8, 1.4)); }
      else b.resting = true;
    }
    if (b.x < 20 || b.x > W - 20) { b.vx = -b.vx * 0.6; b.x = clamp(b.x, 20, W - 20); }
  }
  draw(layer) {
    for (const b of this.bits) {
      if (b.layer !== layer) continue;
      const a = clamp(b.life / 0.5, 0, 1);
      ctx.globalAlpha = a;
      switch (b.kind) {
        case 'candy': drawCandy(b.x, b.y, b.rot, b.size, b.col, b.candy); break;
        case 'confetti':
          push(b.x, b.y, b.rot * 57, Math.cos(b.life * 9), 1);
          rect(-b.size / 2, -b.size / 3, b.size, b.size * 0.66, b.col); pop(); break;
        case 'puff': {
          const t = b.life / b.max;
          ctx.globalAlpha = t * 0.85;
          circ(b.x, b.y, b.size, b.col, 0);
          ctx.globalAlpha = t * 0.5; circ(b.x - b.size * 0.3, b.y - b.size * 0.3, b.size * 0.4, WHITE, 0);
          break;
        }
        case 'sparkle': {
          const s = b.size * Math.sin(Math.PI * b.life / b.max);
          star(b.x, b.y, s, b.rot, 4, b.col, 0); star(b.x, b.y, s * 0.45, b.rot, 4, WHITE, 0); break;
        }
        case 'heart': {
          const s = b.size * Math.min(1, (b.max - b.life) * 6);
          push(b.x, b.y, Math.sin(b.life * 6) * 12); heart(0, 0, s, b.col, 2.5); pop(); break;
        }
        case 'note':
          push(b.x, b.y, Math.sin(b.life * 6) * 15);
          line(b.size * 0.8, 0, b.size * 0.8, -b.size * 3, 3, b.col, 2);
          line(b.size * 0.8, -b.size * 3, b.size * 2, -b.size * 2.3, 3, b.col, 2);
          ell(0, 0, b.size, b.size * 0.75, b.col, 2.5, -0.3);
          pop(); break;
        case 'bubble':
          ctx.globalAlpha = a * 0.55; circ(b.x, b.y, b.size, b.col, 2);
          ctx.globalAlpha = a; ell(b.x - b.size * 0.35, b.y - b.size * 0.4, b.size * 0.3, b.size * 0.18, WHITE, 0); break;
        case 'crumb': circ(b.x, b.y, b.size, b.col, 0); break;
        case 'trail': glow(b.x, b.y, b.size * 3, b.col, a * 0.7); circ(b.x, b.y, b.size * 0.6 * a, '#ffb4b4', 0); break;
        case 'drop': ell(b.x, b.y, b.size * 0.7, b.size, b.col, 1.5); break;
        case 'leaf':
          push(b.x, b.y, b.rot * 57, Math.cos(b.life * 3 + b.ph), 1);
          ctx.beginPath(); ctx.moveTo(-b.size, 0); ctx.quadraticCurveTo(0, -b.size * 0.9, b.size, 0); ctx.quadraticCurveTo(0, b.size * 0.9, -b.size, 0);
          paint(b.col, 2); pop(); break;
        case 'dust': ctx.globalAlpha = a * 0.9; circ(b.x, b.y, b.size, b.col, 0); break;
        case 'z': ctx.globalAlpha = Math.min(1, b.life); word('z', b.x, b.y, b.size * (1.2 - b.life / b.max * 0.5), -10, b.col); break;
      }
      ctx.globalAlpha = 1;
    }
  }
  drawWords() {
    for (const w of this.words) {
      const age = w.max - w.life;
      const s = springOut(age * 1.4) * clamp(w.life / 0.25, 0, 1);
      word(w.text, w.x, Math.max(w.y - age * 18, w.size * 0.6 + 120), w.size * s, w.rot + Math.sin(age * 9) * 4, w.col);
    }
  }
}
// ---------- sound: everything is synthesised, nothing is loaded ----------
const AU = { ctx: null, muted: false };

function audioStart() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const C = AU.ctx = new AC();
  const comp = C.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.2;
  comp.connect(C.destination);
  AU.master = C.createGain(); AU.master.gain.value = AU.muted ? 0 : 0.9; AU.master.connect(comp);
  // a small warm room for the music and the noises
  AU.verb = C.createConvolver();
  const len = Math.floor(C.sampleRate * 2.4), imp = C.createBuffer(2, len, C.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = imp.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
  }
  AU.verb.buffer = imp;
  const vg = C.createGain(); vg.gain.value = 0.32; AU.verb.connect(vg); vg.connect(AU.master);
  AU.music = C.createGain(); AU.music.gain.value = 0.55; AU.music.connect(AU.master); AU.music.connect(AU.verb);
  AU.amb = C.createGain(); AU.amb.gain.value = 0.7; AU.amb.connect(AU.master);
  AU.fx = C.createGain(); AU.fx.gain.value = 0.85; AU.fx.connect(AU.master);
  const fs = C.createGain(); fs.gain.value = 0.25; AU.fx.connect(fs); fs.connect(AU.verb);
  const nb = C.createBuffer(1, C.sampleRate * 2, C.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  AU.noise = nb;
  Music.start();
  Amb.set(Amb.want);
}
function setMuted(m) {
  AU.muted = m;
  if (AU.ctx) AU.master.gain.setTargetAtTime(m ? 0 : 0.9, AU.ctx.currentTime, 0.1);
}

// osc plays one enveloped oscillator note into dest.
function osc(type, f0, t, dur, vol, dest, o = {}) {
  const C = AU.ctx, n = C.createOscillator(), g = C.createGain();
  n.type = type; n.frequency.setValueAtTime(f0, t);
  if (o.f1) n.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + (o.sweep ?? dur));
  if (o.path) for (const [ft, fv] of o.path) n.frequency.linearRampToValueAtTime(fv, t + ft);
  if (o.vib) {
    const l = C.createOscillator(), lg = C.createGain();
    l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(n.frequency);
    l.start(t); l.stop(t + dur + 0.2);
  }
  if (o.fm) { // a simple FM modulator for bells and electric piano
    const m = C.createOscillator(), mg = C.createGain();
    m.frequency.value = f0 * o.fm[0]; mg.gain.setValueAtTime(f0 * o.fm[1], t);
    mg.gain.setTargetAtTime(0, t, o.fm[2]); m.connect(mg); mg.connect(n.frequency);
    m.start(t); m.stop(t + dur + 0.2);
  }
  const a = o.a ?? 0.005, hold = o.hold ?? 0;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  if (hold) g.gain.setValueAtTime(vol, t + a + hold);
  g.gain.setTargetAtTime(0.0001, t + a + hold, o.d ?? dur / 4);
  let out = g;
  if (o.lp) { const f = C.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q ?? 0.7; g.connect(f); out = f; }
  if (o.bp) { const f = C.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.q ?? 2; g.connect(f); out = f; }
  if (o.pan !== undefined && C.createStereoPanner) {
    const p = C.createStereoPanner(); p.pan.setValueAtTime(o.pan, t);
    if (o.pan1 !== undefined) p.pan.linearRampToValueAtTime(o.pan1, t + dur);
    out.connect(p); out = p;
  }
  n.connect(g); out.connect(dest);
  n.start(t); n.stop(t + dur + 0.1);
  return n;
}
// noise plays a burst of filtered noise.
function noise(t, dur, vol, dest, o = {}) {
  const C = AU.ctx, s = C.createBufferSource(), f = C.createBiquadFilter(), g = C.createGain();
  s.buffer = AU.noise; s.loop = true;
  f.type = o.type ?? 'bandpass'; f.frequency.setValueAtTime(o.f0 ?? 1000, t); f.Q.value = o.q ?? 1;
  if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
  const a = o.a ?? 0.005;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a);
  if (o.hold) g.gain.setValueAtTime(vol, t + a + o.hold);
  g.gain.setTargetAtTime(0.0001, t + a + (o.hold ?? 0), o.d ?? dur / 4);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.1);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// ---- instruments (used by the music and by some noises) ----
const INST = {
  box(f, t, dur, v, out) { // music box
    [[1, 1, 1.4], [2, 0.32, 0.6], [3, 0.1, 0.3], [4.2, 0.07, 0.2]].forEach(([k, a, d]) => osc('sine', f * k, t, d * 2, v * a * 0.22, out, { d: d / 2.5 }));
  },
  bell(f, t, dur, v, out) { osc('sine', f, t, 1.6, v * 0.2, out, { fm: [3.5, 2.2, 0.25], d: 0.5 }); },
  marimba(f, t, dur, v, out) {
    osc('sine', f, t, 0.6, v * 0.32, out, { d: 0.14 });
    osc('sine', f * 4, t, 0.1, v * 0.06, out, { d: 0.02 });
  },
  epiano(f, t, dur, v, out) {
    osc('sine', f, t, dur + 1.2, v * 0.2, out, { fm: [1, 1.4, 0.35], d: 0.7 });
    osc('sine', f * 2, t, 0.6, v * 0.03, out, { d: 0.2 });
  },
  flute(f, t, dur, v, out) {
    osc('sine', f, t, dur + 0.3, v * 0.16, out, { a: 0.09, hold: dur * 0.75, d: 0.12, vib: [5, f * 0.006] });
    osc('triangle', f * 2, t, dur + 0.3, v * 0.025, out, { a: 0.1, hold: dur * 0.7, d: 0.1 });
    noise(t, 0.12, v * 0.02, out, { f0: f * 2, q: 3, d: 0.05 });
  },
  pluck(f, t, dur, v, out) { osc('triangle', f, t, 0.5, v * 0.09, out, { d: 0.12, lp: 2600 }); },
  harp(f, t, dur, v, out) { osc('triangle', f, t, 1.6, v * 0.08, out, { d: 0.45, lp: 3000 }); },
  pad(f, t, dur, v, out) {
    for (const det of [-7, 7]) osc('sawtooth', f * Math.pow(2, det / 1200), t, dur + 1.4, v * 0.03, out, { a: 0.9, hold: Math.max(0, dur - 0.9), d: 0.6, lp: 750 });
  },
  bass(f, t, dur, v, out) { osc('sine', f, t, dur + 0.4, v * 0.26, out, { a: 0.01, d: dur * 0.35 }); },
  pizz(f, t, dur, v, out) { osc('triangle', f, t, 0.4, v * 0.22, out, { d: 0.09, lp: 900 }); },
  wood(f, t, dur, v, out) { osc('sine', 950, t, 0.05, v * 0.05, out, { d: 0.015 }); },
};

  start() {
    // melody notes indexed by their starting eighth
    this.events = {};
    let b = 0;
    for (const [m, d] of THEME.melody) { this.events[b * 2] = [m, d]; b += d; }
    this.nextT = AU.ctx.currentTime + 0.15;
    this.timer = setInterval(() => this.tick(), 40);
  },
  set(name) { this.want = name; },
  tick() {
    const C = AU.ctx;
    while (this.nextT < C.currentTime + 0.25) {
      const i = this.step % 96; // 16 bars of 3 beats, in eighths
      if (i % 6 === 0) this.arr = ARRANGE[this.want] || ARRANGE.cover; // change instruments on the bar
      const a = this.arr, beat = 60 / a.bpm, t = this.nextT, v = a.soft ?? 1;
      const bar = Math.floor(i / 6), ch = CHORD[THEME.chords[bar]], out = AU.music;
      if (i % 6 === 0) {
        if (a.pad) for (const m of ch) INST.pad(mtof(m + 12), t, beat * 3, a.pad * v, out);
        if (a.bass) INST[a.bass](mtof(ch[0] - (ch[0] > 47 ? 12 : 0)), t, beat * 2, v, out);
      }
      if (a.bass === 'pizz' && i % 6 === 2) INST.pizz(mtof(ch[2] - 12), t, beat, v * 0.7, out);
      if (a.bass === 'pizz' && i % 6 === 4) INST.pizz(mtof(ch[1] - 12), t, beat, v * 0.7, out);
      if (a.arp) INST[a.arp](mtof(ch[[0, 1, 2, 1, 2, 1][i % 6]] + 24), t, beat / 2, v * (i % 2 ? 0.6 : 0.9), out);
      if (a.perc && i % 2 === 0) INST.wood(0, t, 0, v * (i % 6 === 0 ? 1.4 : 0.8), out);
      const e = this.events[i];
      if (e) INST[a.lead](mtof(e[0] + a.oct), t, e[1] * beat, v, out);
      this.nextT += beat / 2;
      this.step++;
    }
  },
};

const Amb = {
  want: 'cover', beds: [], clock: 0, timers: {},
  set(name) {
    this.want = name;
    if (!AU.ctx) return;
    const C = AU.ctx, now = C.currentTime;
    for (const b of this.beds) { b.g.gain.setTargetAtTime(0, now, 0.4); b.nodes.forEach(n => n.stop(now + 2)); }
    this.beds = [];
    const bed = (vol, filt, f, q = 0.7, lfo = 0) => {
      const s = C.createBufferSource(), fl = C.createBiquadFilter(), g = C.createGain(), nodes = [s];
      s.buffer = AU.noise; s.loop = true; fl.type = filt; fl.frequency.value = f; fl.Q.value = q;
      g.gain.setValueAtTime(0, now); g.gain.setTargetAtTime(vol, now + 0.3, 0.8);
      s.connect(fl); fl.connect(g);
      if (lfo) { // a slow swell, like wind or water
        const l = C.createOscillator(), lg = C.createGain(), sw = C.createGain();
        l.frequency.value = lfo; lg.gain.value = 0.5; sw.gain.value = 0.6;
        l.connect(lg); lg.connect(sw.gain); fl.connect(sw); sw.connect(g); fl.disconnect(g);
        l.start(); nodes.push(l);
      }
      g.connect(AU.amb); s.start(0, Math.random()); this.beds.push({ g, nodes });
    };
    const hum = (f, vol) => {
      const o = C.createOscillator(), fl = C.createBiquadFilter(), g = C.createGain();
      o.type = 'sawtooth'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 160;
      g.gain.setValueAtTime(0, now); g.gain.setTargetAtTime(vol, now + 0.3, 0.8);
      o.connect(fl); fl.connect(g); g.connect(AU.amb); o.start(); this.beds.push({ g, nodes: [o] });
    };

    if (name === 'town') bed(0.03, 'lowpass', 260, 0.7, 0.07);
    if (name === 'river') { bed(0.09, 'bandpass', 520, 0.6, 0.23); bed(0.012, 'highpass', 4000, 0.7, 0.4); }

    if (name === 'home') bed(0.05, 'lowpass', 380, 0.8, 0.08);

    if (name === 'station' || name === 'tower') bed(0.03, 'lowpass', 300, 0.7, 0.1);

    if (name === 'farm') bed(0.04, 'lowpass', 400, 0.8, 0.1);

// ---------- Little Dino ----------
// Hops about in little runs, looks around, gobbles candy it finds on the

const DINO_GREEN = { body: '#78cd6e', belly: '#f5eeaa', spike: '#ffa05a' };

  press() {

  start(name) {

  hop(x1, y1, dur, h) {

  // follow the ground while hopping along it
  stepHop(dt, follow = true) {

  update(dt) {

// drawDino draws a dino in its own frame: feet at 0,0, facing right.
function drawDino(o) {
  const { t, cols } = o;
  const wag = Math.sin(t * 5) * 8, walk = o.walk || 0;
  if (o.skates) { drawSkates(t, o.skateSpin ?? t * 12); ctx.save(); ctx.translate(0, -14); }
  // the far arm, raised when cheering
  if (o.cheer) line(-8, -70, -14, -112 + Math.sin(t * 14) * 6, 7, shade(cols.body, -0.12));
  // tail
  ctx.beginPath(); ctx.moveTo(-26, -28); ctx.quadraticCurveTo(-70, -30 + wag * 0.3, -100, -62 + wag);
  ctx.quadraticCurveTo(-74, -46 + wag * 0.4, -30, -62); ctx.closePath(); paint(cols.body, 3);
  // back leg
  ell(-16, -14 + walk * 0.3, 18, 15, shade(cols.body, -0.12));
  // spikes
  for (let i = 0; i < 5; i++) {
    const a = Math.PI * 1.05 + i * 0.32;
    const bx = Math.cos(a) * 44, by = -52 + Math.sin(a) * 42, tx = Math.cos(a) * 64, ty = -52 + Math.sin(a) * 62;
    const px = -Math.sin(a) * 11, py = Math.cos(a) * 11;
    poly([bx - px, by - py, bx + px, by + py, tx, ty], cols.spike, 3);
  }
  ell(0, -52, 48, 42, cols.body);
  if (o.pj) { // striped pyjamas
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, -52, 48, 42, 0, 0, TAU); ctx.clip();
    rect(-50, -96, 100, 90, o.pj);
    for (let y = -92; y < 0; y += 14) rect(-50, y, 100, 6, shade(o.pj, 0.45));
    ctx.restore(); ell(0, -52, 48, 42, null, 3);
  }
  ell(14, -44, 26, 28, o.pj ? shade(o.pj, 0.6) : cols.belly, 2.5);
  ctx.globalAlpha = 0.4;
  for (let i = 0; i < 3; i++) line(4, -58 + i * 12, 26, -58 + i * 12, 2, shade(cols.belly, -0.3), 0);
  ctx.globalAlpha = 1;
  circ(-22, -66, 6, shade(cols.body, -0.18), 0); circ(-32, -46, 4, shade(cols.body, -0.18), 0); circ(-10, -82, 4, shade(cols.body, -0.18), 0);
  ell(20, -12 - walk * 0.3, 17, 14, cols.body);
  circ(30, -7 - walk * 0.3, 3, WHITE, 0);
  // head
  const bob = o.roaring ? -6 : Math.sin(t * 3) * 2;
  push(40, -98 + bob, o.noseUp || 0);
  drawDinoHead(o);
  pop();
  if (o.bag) { // Mama's red work bag
    line(-6, -86, 18, -40, 3, '#8c3246', 0);
    rrect(6, -44, 30, 24, 6, '#e6505a'); line(12, -44, 30, -44, 3, '#b43c46', 0);
  }
  // little arm, or waving, or both up
  if (o.cheer) line(26, -66, 44, -110 + Math.cos(t * 14) * 6, 7, cols.body);
  else if (o.wave !== null && o.wave !== undefined) line(26, -66, 46, -104 + o.wave * 8, 7, cols.body);
  else if (o.reach) line(26, -66, 62, -60, 7, cols.body);
  else line(26, -66, 42, -60 + (o.arm || 0), 7, cols.body);
  if (o.skates) ctx.restore();
}

// drawSkates: Papa's rollerblades, with red wheels that glow
function drawSkates(t, spin) {
  for (const fx of [-16, 20]) {
    glow(fx, 8, 34, '#ff3c3c', 0.35 + 0.15 * Math.sin(t * 20 + fx));
    rrect(fx - 18, -14, 34, 16, 6, '#3c3c50');
    rrect(fx - 4, -26, 18, 16, 5, '#3c3c50');
    for (const wx of [-12, -1, 10]) {
      circ(fx + wx, 7, 5.5, '#ff4646', 2);
      line(fx + wx, 7, fx + wx + Math.cos(spin) * 4, 7 + Math.sin(spin) * 4, 1.5, '#ffd0d0', 0);
    }
  }

// drawDinoHead draws the head in its own frame (centre of the head at 0,0).
function drawDinoHead(o) {
  const cols = o.cols;
  if (!o.hair && !o.helmet) poly([-22, -24, -8, -33, -32, -42], cols.spike, 3);

  circ(0, 0, 33.5, cols.body, 0); // one outline round head and snout

// ---------- 14. tucked in: goodnight ----------
class TuckPage extends StoryPage {
  constructor() {
    super({ name: 'tuck', floor: 720,
      text: 'Mama tucks Léo and Louis in, snug and warm. She sings their song and kisses them goodnight. Goodnight, Léo. Goodnight, Louis.',
      tricks: [['mobile', 'glowstars', 'lamp'], ['yawn', 'giggle', 'sleep'], ['sing', 'kiss', 'blanket']],
      who: ['Bedroom', 'Léo & Louis', 'Mama'],
      durs: { mobile: 3.5, glowstars: 5, lamp: 6, yawn: 2.4, giggle: 2, sleep: 5, sing: 6, kiss: 2.4, blanket: 2 } });
    this.mama = mama(this.st, { x: 640, y: 640, face: 1, look: { bow: true } });
    this.papa = papa(this.st, { x: 1150, y: 640, face: -1 });
    this.cast = [this.mama, this.papa];
    this.stars = makeStars(18, 140, 340, 160, 360);
    this.ceilingStars = makeStars(40, 20, W - 20, 120, 380);
    this.blinkA = 2; this.blinkB = 3;
  }
  act(a) {
    const st = this.st;
    if (a === 'mobile') sfx('chime', 1);
    if (a === 'glowstars') sfx('shimmer', 0.7);
    if (a === 'lamp') sfx('click', 1, 0.6);
    if (a === 'yawn') { sfx('yawn', 0.8, 1.5); setTimeout(() => sfx('yawn', 0.8, 1.3), 300); st.say('YAWN!', 640, 380, 50, '#cfe0ff'); }
    if (a === 'giggle') { sfx('giggle', 1, 1.2); st.hearts(470, 470, 2); st.hearts(810, 470, 2); }
    if (a === 'sleep') sfx('snore', 0.6);
    if (a === 'sing') { this.mama.do('talk', 5.8); sfx('lullaby', 1); }
    if (a === 'kiss') { this.mama.do('kiss', 2); sfx('smooch', 1); setTimeout(() => sfx('smooch', 1, 1.2), 500); st.hearts(470, 460, 3); setTimeout(() => this.st.hearts(810, 460, 3), 500); }
    if (a === 'blanket') { sfx('swoosh', 0.4, 1.4); st.say('SNUG AS A BUG!', 640, 380, 46, '#ffe9b4'); }
  }
  sleepy() { return clamp((this.st.t - 6) / 40, 0, 0.8); }
  tick(dt, t, A) {
    this.blinkA -= dt; if (this.blinkA < -0.2) this.blinkA = rnd(2.5, 5);
    this.blinkB -= dt; if (this.blinkB < -0.2) this.blinkB = rnd(2.5, 5);
    if (A.on('sing') && this.every('n', 0.5)) this.st.notes(this.mama.x + 40, 430, 1);
    if (A.on('sleep') && this.every('z', 1)) { this.st.zzz(500, 430); this.st.zzz(840, 430); }
    if (!A.on('sleep') && this.sleepy() > 0.6 && Math.random() < dt * 0.3) this.st.zzz(pick([500, 840]), 430);
    if (A.on('mobile') && Math.random() < dt * 6) this.st.sparkles(640, 260, 1, 80, '#fff3a0');
  }
  drawBed(x, cols, pj, blink, flip) {
    const A = this.acts, t = this.st.t;
    const g = A.on('giggle') ? A.t('giggle') : -1, wig = g >= 0 ? Math.sin(g * 24 + x) * 5 : 0;
    const yawn = A.on('yawn') ? A.t('yawn') : -1, open = yawn > 0.1 && yawn < 1.6 ? Math.sin((yawn - 0.1) / 1.5 * Math.PI) : g >= 0 ? 0.5 : 0;
    const sleepy = A.on('sleep') ? 1 : this.sleepy();
    rrect(x - 130, 420, 26, 200, 12, '#c8965a');
    ell(x - 70, 470, 60, 26, '#fffaf0');
    push(x - 66 + wig * 0.3, 446, -10 + wig, 0.75, 0.75);
    drawDinoHead({ t, cols, hair: true, open, blink, sleepy: open > 0.3 ? 0 : sleepy });
    pop();
    const tuck = A.on('blanket') ? Math.sin(Math.PI * clamp(A.t('blanket') / 2, 0, 1)) * 10 : 0;
    push(0, Math.sin(t * 1.4 + x) * 1.5 - tuck);
    ctx.beginPath(); ctx.moveTo(x - 90, 600); ctx.lineTo(x - 90, 490); ctx.quadraticCurveTo(x, 470, x + 120, 486); ctx.lineTo(x + 120, 600); ctx.closePath(); paint(pj, 3);
    ctx.save(); ctx.clip(); for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) if ((i + j) % 2) rect(x - 90 + i * 36, 480 + j * 30, 36, 30, shade(pj, 0.4)); ctx.restore();
    rrect(x - 94, 486, 218, 12, 6, '#fffaf0', 2.5);
    pop();
    rect(x - 130, 598, 270, 14, '#a0703c');
  }
  draw() {
    const st = this.st, t = st.t, A = this.acts;
    const dark = A.on('lamp') ? ease(A.t('lamp') / 0.4) * (1 - ease((A.t('lamp') - 5.4) / 0.5)) : 0;
    drawRoom('#5a5aa0', '#7a74b4', '#b47c5a', '#9a6448');
    ctx.globalAlpha = 0.22; for (let x = 30; x < W; x += 90) for (let y = 150; y < 560; y += 90) star(x + (y / 90 % 2) * 45, y, 7, 0, 5, '#fff3c8', 0); ctx.globalAlpha = 1;
    drawWindow(120, 150, 210, 210, '#1e2456', () => { drawStars(this.stars, t); drawMoon(270, 220, 34, t, 0); });
    // the mobile over the beds
    const spin = A.on('mobile') ? t * 2.4 : t * 0.35;
    line(640, 0, 640, 150, 2, INK, 0); rrect(530, 148, 220, 8, 4, '#c8965a', 2.5);
    for (let i = 0; i < 5; i++) { const a = spin + i / 5 * TAU, px = 640 + Math.cos(a) * 100, len = 60 + (i % 2) * 30; line(px, 152, px, 152 + len, 1.5, INK, 0); push(px, 160 + len, 0, 0.8 + Math.sin(a) * 0.2, 0.8 + Math.sin(a) * 0.2); drawCandy(0, 0, Math.sin(t + i) * 0.3, 18, CANDY[i], i % 4); pop(); }
    // the robot nightlight, a little Bolt
    rrect(1000, 480, 90, 16, 5, '#c8965a'); glow(1045, 450, 80, '#8cffc8', 0.3 + dark * 0.3);
    rrect(1030, 440, 30, 40, 6, '#5acdc3', 2.5); circ(1039, 455, 3, WHITE, 0); circ(1051, 455, 3, WHITE, 0);
    // two little beds, Léo on the left, Louis on the right
    this.drawBed(470, LEO_COLS, '#7c8cf0', this.blinkA < 0, false);
    this.drawBed(810, LOUIS_COLS, '#ff8cb4', this.blinkB < 0, true);
    // Papa leaning in the doorway, Mama between the beds
    rrect(1100, 300, 140, 310, 12, '#ffd88a'); glow(1170, 450, 140, '#ffd27a', 0.3);
    this.papa.draw();
    this.mama.draw();
    if (dark > 0) {
      ctx.globalAlpha = dark * 0.55; rect(0, 0, W, H, '#0c0e2a'); ctx.globalAlpha = dark;
      for (const s of this.ceilingStars) { glow(s.x, s.y, 14, '#c8ffb4', 0.5); star(s.x, s.y, 6, 0.3, 5, '#d8ffc8', 0); }
      ctx.globalAlpha = 1;
    }
    if (A.on('glowstars')) {
      const k = A.t('glowstars'), a = clamp(k / 0.5, 0, 1) * clamp((5 - k) / 0.6, 0, 1);
      for (let i = 0; i < 16; i++) { const ang = i / 16 * TAU + k * 0.5, r = 260 + (i % 3) * 120; ctx.globalAlpha = a * 0.8; star(1045 + Math.cos(ang) * r, 420 + Math.sin(ang) * r * 0.6, 12, ang, 5, '#fff3a0', 0); }
      ctx.globalAlpha = 1;
    }
    st.draw(0); st.draw(1); st.draw(2);
    if (t > 16) word('The End', 1130, 680, 34 * Math.min(1, (t - 16)), -4, '#ffe9b4');
    st.drawWords();
  }
}
// ---------- start-up, the frame loop and the keys ----------
(function () {
  const canvas = document.getElementById('page');
  const main = canvas.getContext('2d');
  const offA = document.createElement('canvas'), offB = document.createElement('canvas');
  let scale = 1;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const bw = Math.max(320, Math.min(2200, Math.round(r.width * dpr)));
    canvas.width = bw; canvas.height = Math.round(bw * H / W);
    offA.width = offB.width = canvas.width; offA.height = offB.height = canvas.height;
    scale = canvas.width / W;
  }
  window.addEventListener('resize', resize);
  resize();

  Book.init();
  for (const p of Book.pages) if (reduce) p.reduce = true;

  function prep(g) {
    ctx = g;
    g.setTransform(scale, 0, 0, scale, 0, 0);
    g.lineJoin = 'round'; g.lineCap = 'round';
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    Book.update(dt);
    if (Book.turn) {
      const tr = Book.turn, lo = Math.min(tr.from, tr.to), hi = Math.max(tr.from, tr.to);
      const k = ease(tr.t / tr.dur), e = tr.dir > 0 ? k : 1 - k;
      prep(offA.getContext('2d')); drawPage(Book.pages[lo]);
      prep(offB.getContext('2d')); drawPage(Book.pages[hi]);
      prep(main); main.fillStyle = '#3a2430'; main.fillRect(0, 0, W, H);
      drawTurn(main, offA, offB, e);
    } else {
      prep(main);
      main.save(); main.translate((Book.nudge || 0) * -40, 0);
      drawPage(Book.page());
      main.restore();
      drawOverlay();
    }
    requestAnimationFrame(frame);
  }

  // page corners and dots, drawn over the page while it rests
  function drawOverlay() {
    const p = Book.page(), t = p.st.t, n = Book.pages.length;
    for (let i = 0; i < n; i++) circ(640 - (n - 1) * 11 + i * 22, 700, i === Book.cur ? 6 : 4, i === Book.cur ? '#fffaf0' : 'rgba(255,250,240,0.5)', i === Book.cur ? 2 : 0);
    const ready = !p.text || p.shown > TEXT_DELAY + 0.5 + p.text.split(' ').length / TEXT_WPS;
    if (Book.cur < n - 1) {
      // a folded-up corner bottom right that wiggles once the text has been read
      const k = ready ? 1 + Math.sin(t * 4) * 0.25 : 0.6, s = 46 * k;
      ctx.save(); ctx.shadowColor = 'rgba(40,20,30,0.35)'; ctx.shadowBlur = 8;
      poly([W, H - s, W - s, H, W - s, H - s], '#f6eedd', 2);
      ctx.restore();
      if (ready) chevron(W - 26, 360, 1, t);
    }
    if (Book.cur > 0) chevron(26, 360, -1, t);
    if (Book.cur === 0) {
      const a = 0.75 + 0.25 * Math.sin(t * 3);
      ctx.globalAlpha = a;
      word(AU.ctx ? 'Press  →  to open the book' : 'Press any key to start', 640, 398, 30, 0, '#fff3a0');
      ctx.globalAlpha = 1;
    }
  }
  function chevron(x, y, dir, t) {
    const o = Math.sin(t * 3) * 4 * dir;
    ctx.globalAlpha = 0.55;
    line(x + o - dir * 8, y - 16, x + o + dir * 6, y, 6, '#fffaf0', 2);
    line(x + o + dir * 6, y, x + o - dir * 8, y + 16, 6, '#fffaf0', 2);
    ctx.globalAlpha = 1;
  }

  // ---- input ----
  function act(k) {
    const first = !AU.ctx;
    audioStart();
    if (first && Book.cur === 0 && k !== 'next') return; // the first press just wakes the sound
    if (k === 'next') Book.go(1);
    else if (k === 'prev') Book.go(-1);
    else Book.press({ space: 0, enter: 1, ctrl: 2 }[k]);
  }
  window.addEventListener('keydown', e => {
    let k = null;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') k = 'next';
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') k = 'prev';
    else if (e.key === ' ' || e.code === 'Space') k = 'space';
    else if (e.key === 'Enter') k = 'enter';
    else if (e.key === 'Control') k = 'ctrl';
    if (!k) { if (!AU.ctx) audioStart(); return; }
    e.preventDefault();
    if (e.repeat) return;
    act(k);
    flash(k);
  });
  canvas.addEventListener('pointerdown', e => {
    canvas.focus();
    const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    const k = x < 0.12 ? 'prev' : x > 0.88 ? 'next' : ['space', 'enter', 'ctrl'][tapN++ % 3];
    act(k); flash(k);
  });
  let tapN = 0;
  document.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => { act(b.dataset.key); flash(b.dataset.key); canvas.focus(); }));
  function flash(k) {
    const b = document.querySelector(`[data-key="${k}"]`);
    if (!b) return;
    b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
  }
  // the page-turn buttons grey out at the ends of the book
  setInterval(() => {
    document.querySelector('[data-key="prev"]').disabled = Book.cur === 0;
    document.querySelector('[data-key="next"]').disabled = Book.cur === Book.pages.length - 1;
  }, 200);
  const mute = document.getElementById('mute');
  mute.addEventListener('click', () => {
    audioStart(); setMuted(!AU.muted);
    mute.setAttribute('aria-pressed', AU.muted ? 'true' : 'false');
    mute.setAttribute('aria-label', AU.muted ? 'Sound off' : 'Sound on');
  });
  requestAnimationFrame(frame);
})();
