<div class="book"><canvas id="page" tabindex="0" aria-label="Little Dino Comes Home, a picture book. Left and right arrows turn the pages; Space, Enter and Ctrl make things happen."></canvas></div>
<div class="keys">
  <button type="button" data-key="prev">←<small>back</small></button>
  <button type="button" class="wide" data-key="space">Space<small>the big thing</small></button>
  <button type="button" data-key="enter">Enter<small>the friends</small></button>
  <button type="button" data-key="ctrl">Ctrl<small>Little Dino</small></button>
  <button type="button" data-key="next">→<small>next page</small></button>
  <button type="button" id="mute" aria-pressed="false">Sound on</button>
</div>
