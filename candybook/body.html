<div class="book"><canvas id="page" tabindex="0" aria-label="Little Dino Comes Home, a picture book. Left and right arrows turn the pages; the pink, blue and green buttons (Space, Enter and Ctrl) make things happen."></canvas></div>
<div class="keys">
  <button type="button" class="turn" data-key="prev" title="Left arrow" aria-keyshortcuts="ArrowLeft"><span class="arrow" aria-hidden="true">◀</span><span class="what">Back</span></button>
  <button type="button" class="act pink" data-key="space" title="Space bar" aria-keyshortcuts="Space"><span class="who">Candy machine</span><span class="what">Candy fountain</span></button>
  <button type="button" class="act blue" data-key="enter" title="Enter key" aria-keyshortcuts="Enter"><span class="who">Robots</span><span class="what">Robot disco</span></button>
  <button type="button" class="act green" data-key="ctrl" title="Ctrl key" aria-keyshortcuts="Control"><span class="who">Little Dino</span><span class="what">Big jump</span></button>
  <button type="button" class="turn" data-key="next" title="Right arrow" aria-keyshortcuts="ArrowRight"><span class="what">Next page</span><span class="arrow" aria-hidden="true">▶</span></button>
  <button type="button" id="mute" aria-pressed="false">Sound on</button>
</div>
