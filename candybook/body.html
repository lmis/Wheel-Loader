<div class="book"><canvas id="page" tabindex="0" aria-label="Mama Comes Home, a picture book. Left and right arrows turn the pages; the nine colour buttons (or keys 1 to 9) make things happen."></canvas></div>
<div class="keys">
  <button type="button" class="turn" data-key="prev" title="Back (Left arrow)" aria-label="Previous page" aria-keyshortcuts="ArrowLeft">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M30 10 L14 24 L30 38" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="acts">
    <button type="button" class="act" data-slot="0" style="--c:#ff9ab8" title="Button 1" aria-label="Button 1" aria-keyshortcuts="1"></button>
    <button type="button" class="act" data-slot="1" style="--c:#ffcf6a" title="Button 2" aria-label="Button 2" aria-keyshortcuts="2"></button>
    <button type="button" class="act" data-slot="2" style="--c:#9ee28c" title="Button 3" aria-label="Button 3" aria-keyshortcuts="3"></button>
    <button type="button" class="act" data-slot="3" style="--c:#8fd0ff" title="Button 4" aria-label="Button 4" aria-keyshortcuts="4"></button>
    <button type="button" class="act" data-slot="4" style="--c:#c7a6ff" title="Button 5" aria-label="Button 5" aria-keyshortcuts="5"></button>
    <button type="button" class="act" data-slot="5" style="--c:#ff9f7a" title="Button 6" aria-label="Button 6" aria-keyshortcuts="6"></button>
    <button type="button" class="act" data-slot="6" style="--c:#7ee0cf" title="Button 7" aria-label="Button 7" aria-keyshortcuts="7"></button>
    <button type="button" class="act" data-slot="7" style="--c:#ffb3e6" title="Button 8" aria-label="Button 8" aria-keyshortcuts="8"></button>
    <button type="button" class="act" data-slot="8" style="--c:#f5e38a" title="Button 9" aria-label="Button 9" aria-keyshortcuts="9"></button>
  </div>
  <button type="button" class="turn" data-key="next" title="Next page (Right arrow)" aria-label="Next page" aria-keyshortcuts="ArrowRight">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 10 L34 24 L18 38" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" id="mute" aria-pressed="false" aria-label="Sound on" title="Sound">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 19 H16 L26 10 V38 L16 29 H8 Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <g class="waves" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M32 18 Q36 24 32 30"/><path d="M37 13 Q44 24 37 35"/></g>
      <g class="cross" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M33 18 L43 30"/><path d="M43 18 L33 30"/></g></svg>
  </button>
</div>
